[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scoralyx-player"
version = "0.2.0"
description = "Player Linux pour l'écosystème d'affichage Scoralyx"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Scoralyx contributors"}]
dependencies = []

[project.scripts]
scoralyx-player = "scoralyx_player.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

