[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scoralyx-player"
version = "0.4.1"
description = "Player Linux pour l'écosystème d'affichage Scoralyx"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Scoralyx contributors"}]
dependencies = []

[project.scripts]
scoralyx-player = "scoralyx_player.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

